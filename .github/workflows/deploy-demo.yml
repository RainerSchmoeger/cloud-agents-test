name: Deploy Demo

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.number }}"
            SUBPATH="pr-${PR_NUMBER}"
          else
            SUBPATH="main"
          fi
          echo "subpath=${SUBPATH}" >> "$GITHUB_OUTPUT"
          echo "base_path=/${{ github.event.repository.name }}/${SUBPATH}/" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install and build demo
        if: github.event.action != 'closed'
        working-directory: demo
        env:
          BASE_PATH: ${{ steps.target.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Sync build to gh-pages subpath
        run: |
          SUBPATH="${{ steps.target.outputs.subpath }}"
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            echo "PR closed - removing /${SUBPATH}"
            rm -rf "gh-pages/${SUBPATH}"
          else
            rm -rf "gh-pages/${SUBPATH}"
            mkdir -p "gh-pages/${SUBPATH}"
            cp -r demo/dist/* "gh-pages/${SUBPATH}/"
          fi

      - name: Regenerate index.html with links to all builds
        run: |
          ROOT_DIR="gh-pages"
          INDEX="$ROOT_DIR/index.html"

          cat > "$INDEX" << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Demo Builds</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
              h1 { font-size: 1.5rem; }
              ul { list-style: none; padding: 0; }
              li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Demo Builds</h1>
            <ul>
          EOF

          for dir in "$ROOT_DIR"/*/; do
            name=$(basename "$dir")
            if [ "$name" = "index.html" ]; then continue; fi
            echo "              <li><a href=\"${name}/\">${name}</a></li>" >> "$INDEX"
          done

          cat >> "$INDEX" << 'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Commit and push
        run: |
          SUBPATH="${{ steps.target.outputs.subpath }}"
          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            MSG="deploy: remove ${SUBPATH} (closed PR)"
          else
            MSG="deploy: update ${SUBPATH} from ${{ github.sha }}"
          fi
          git commit -m "${MSG}"
          git push origin gh-pages

      - name: Wait for GitHub Pages deployment
        id: wait-pages
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 60;
            const delay = 10000;
            for (let i = 0; i < maxAttempts; i++) {
              try {
                const resp = await fetch(`https://${context.repo.owner}.github.io/${context.repo.repo}/`, {
                  method: 'HEAD',
                  redirect: 'manual',
                });
                core.info(`Attempt ${i + 1}: status ${resp.status}`);
                if (resp.status === 200) {
                  core.info('GitHub Pages is live');
                  return;
                }
              } catch (e) {
                core.info(`Attempt ${i + 1}: ${e.message}`);
              }
              await new Promise(r => setTimeout(r, delay));
            }
            core.warning('Timed out waiting for GitHub Pages to go live');

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const subpath = '${{ steps.target.outputs.subpath }}';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/${subpath}/`;
            const body = `Preview deployed to ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployed to'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
