name: Deploy Demo

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: deploy-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.number }}"
            SUBPATH="pr-${PR_NUMBER}"
          else
            SUBPATH="main"
          fi
          echo "subpath=${SUBPATH}" >> "$GITHUB_OUTPUT"
          echo "base_path=/${{ github.event.repository.name }}/${SUBPATH}/" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install and build demo
        if: github.event.action != 'closed'
        working-directory: demo
        env:
          BASE_PATH: ${{ steps.target.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - name: Checkout gh-pages (for existing subpaths)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Assemble Pages artifact
        run: |
          SUBPATH="${{ steps.target.outputs.subpath }}"
          mkdir -p _site

          # Copy existing content from gh-pages branch (other subpaths)
          if [ -d gh-pages ]; then
            cp -r gh-pages/* _site/ 2>/dev/null || true
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            echo "PR closed - removing /${SUBPATH}"
            rm -rf "_site/${SUBPATH}"
          else
            rm -rf "_site/${SUBPATH}"
            mkdir -p "_site/${SUBPATH}"
            cp -r demo/dist/* "_site/${SUBPATH}/"
          fi

          # Ensure root index.html exists (redirect to /main/ if missing)
          if [ ! -f "_site/index.html" ]; then
            cat > _site/index.html << 'HTMLEOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>cloud-agents-test</title>
              <meta http-equiv="refresh" content="0; url=main/">
            </head>
            <body>Redirecting to <a href="main/">main/</a>...</body>
          </html>
          HTMLEOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Persist gh-pages branch
        run: |
          SUBPATH="${{ steps.target.outputs.subpath }}"
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync _site content back
          rm -rf ./*
          cp -r ../_site/* .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to gh-pages branch"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            MSG="deploy: remove ${SUBPATH} (closed PR)"
          else
            MSG="deploy: update ${SUBPATH} from ${{ github.sha }}"
          fi
          git commit -m "${MSG}"
          git push origin gh-pages

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const subpath = '${{ steps.target.outputs.subpath }}';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/${subpath}/`;
            const body = `Preview deployed to ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployed to'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
